[project]
name = "lgq"
version = "1.0.0"
description = "LGQ: Learnable Geometric Quantization for Image Tokenization"
authors = [
    { name = "Kurban Intelligence Lab" }
]
readme = "README.md"
requires-python = ">= 3.9"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'pytorch',
    'quantization'
  ]
classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.6',
  ]

dependencies = [
    "torch>=2.4",
    "einops>=0.8.0",
    "einx>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/KurbanIntelligenceLab/vector-quantize"
Repository = "https://github.com/KurbanIntelligenceLab/vector-quantize"

[project.optional-dependencies]
examples = ["tqdm", "torchvision"]
evaluation = [
    "lpips>=0.1.4",
    "pytorch-fid>=0.3.0",
    "scikit-image>=0.19.0",
    "pillow>=9.0.0",
    "scipy>=1.7.0",
]
training = [
    "tqdm",
    "torchvision",
    "matplotlib",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.4.2",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["quantization", "configs", "external/vector_quantize_pytorch"]
